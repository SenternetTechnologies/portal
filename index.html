<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Portal | SENTERNET TECHNOLOGIES</title>
    <link rel="icon" type="image/png" href="https://rebrand.ly/senternet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .iframe-container {
            position: absolute;
            top: 64px; /* Header height */
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: calc(100% - 64px);
            border: none;
        }
        .loading-overlay {
            position: fixed;
            top: 64px;
            left: 0;
            width: 100%;
            height: calc(100% - 64px);
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fab-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 50;
        }
        .fab-menu {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 md:px-8 fixed top-0 w-full z-20 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i class="fas fa-wallet text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">SENTERNET TECHNOLOGIES</h1>
                <p class="text-xs text-gray-500 font-medium">Worker Portal • Salary Checking</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex flex-col text-right">
                <span class="text-sm font-semibold text-gray-700">Senthilkumar</span>
                <span class="text-xs text-blue-600">CEO & Founder</span>
            </div>
            <img src="https://www.jotform.com/uploads/senternettechnologies/agent_files/avatar_images/1000009224-6944f3cfaee596.07540393.webp" 
                 alt="CEO" 
                 class="w-10 h-10 rounded-full border-2 border-blue-100 shadow-sm object-cover cursor-pointer hover:scale-105 transition-transform"
                 onclick="window.open('https://rebrand.ly/senternet', '_blank')">
        </div>
    </header>

    <!-- Loading Screen -->
    <div id="loading" class="loading-overlay">
        <div class="loader"></div>
        <p class="mt-4 text-gray-600 font-medium animate-pulse">Connecting to Secure Server...</p>
    </div>

    <!-- Main Content (Iframe) -->
    <iframe 
        id="portalFrame"
        src="https://script.google.com/macros/s/AKfycbzH_udKCzcdrDXbEqhTEK7I0iZ0STnsuANyHD5JEyHBCfrc-ewFGPfPb0mXy04_H3kB/exec" 
        class="iframe-container"
        onload="hideLoading()">
    </iframe>

    <!-- Floating Action Button -->
    <div class="fab-container">
        <div id="fabMenu" class="fab-menu">
            <a href="https://wa.me/918190038085" target="_blank" class="bg-green-500 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:bg-green-600 transition-colors" title="WhatsApp Support">
                <i class="fab fa-whatsapp text-xl"></i>
            </a>
            <a href="https://www.youtube.com/@senternet-technologies" target="_blank" class="bg-red-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:bg-red-700 transition-colors" title="YouTube">
                <i class="fab fa-youtube text-xl"></i>
            </a>
            <a href="https://www.instagram.com/senternet" target="_blank" class="bg-gradient-to-tr from-yellow-400 to-purple-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:opacity-90 transition-opacity" title="Instagram">
                <i class="fab fa-instagram text-xl"></i>
            </a>
        </div>
        <button onclick="toggleFab()" class="bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl hover:bg-blue-700 transition-all transform hover:rotate-90">
            <i id="fabIcon" class="fas fa-plus text-2xl"></i>
        </button>
    </div>

    <!-- Footer Mobile Info (Hidden on Desktop) -->
    <div class="md:hidden fixed bottom-4 left-4 z-30 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full border border-gray-200 shadow-sm text-[10px] text-gray-600 flex items-center gap-2">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        Aranthangi, Pudukkottai
    </div>

    <script>
        function hideLoading() {
            const loader = document.getElementById('loading');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        function toggleFab() {
            const menu = document.getElementById('fabMenu');
            const icon = document.getElementById('fabIcon');
            if (menu.style.display === 'flex') {
                menu.style.display = 'none';
                icon.className = 'fas fa-plus text-2xl';
            } else {
                menu.style.display = 'flex';
                icon.className = 'fas fa-times text-2xl';
            }
        }

        // Handle iframe height dynamically if needed
        window.addEventListener('resize', () => {
            const headerHeight = document.querySelector('header').offsetHeight;
            const iframe = document.getElementById('portalFrame');
            iframe.style.height = (window.innerHeight - headerHeight) + 'px';
        });
    </script>
</body>
</html>
