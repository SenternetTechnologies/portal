<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reset and Full Height */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling outside iframe */
            background-color: #f3f4f6;
        }

        /* Iframe Container */
        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Spinner */
        .loader-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            z-index: -1; /* Hides behind iframe once loaded */
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Loading Indicator (Visible behind iframe while loading) -->
        <div class="loader-wrapper">
            <div class="loader"></div>
        </div>

        <!-- Full Screen Iframe -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxUzkU40_K5SjIDe_2O3NBvDc6mUPHg4ogyvvIOEy3kXwxn8j3FmHesu8wu4GH-CAPXWA/exec" 
            title="Full Screen App"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; camera; microphone; geolocation" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
