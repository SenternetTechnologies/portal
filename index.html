<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reset and Full Height */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling outside iframe */
            background-color: #f3f4f6;
        }

        /* Iframe Container */
        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

    </style>
</head>
<body>

    <div class="app-container">
     

        <!-- Full Screen Iframe -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxUzkU40_K5SjIDe_2O3NBvDc6mUPHg4ogyvvIOEy3kXwxn8j3FmHesu8wu4GH-CAPXWA/exec" 
            title="Full Screen App"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; camera; microphone; geolocation" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
